name: NOVA MUSIC APK Olustur

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: NOVA MUSIC Projesini Olustur
        run: |
          mkdir -p app/src/main/java/com/novamusic/ozel
          mkdir -p app/src/main/assets
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
          done

          cp -r *.html *.css *.js *.mp3 app/src/main/assets/ 2>/dev/null || true

          LOGO_FILE=$(ls *.png *.jpg *.jpeg *.webp 2>/dev/null | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp "$LOGO_FILE" app/src/main/res/mipmap-$d/ic_launcher.png
              cp "$LOGO_FILE" app/src/main/res/mipmap-$d/ic_launcher_round.png
            done
          fi

          printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = "NovaMusicOzel"\ninclude ":app"\n' > settings.gradle

          printf 'plugins {\n    id "com.android.application" version "8.2.2" apply false\n    id "org.jetbrains.kotlin.android" version "1.9.22" apply false\n}\n' > build.gradle

          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n' > gradle.properties

          printf 'plugins {\n    id "com.android.application"\n    id "org.jetbrains.kotlin.android"\n}\nandroid {\n    namespace "com.novamusic.ozel"\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.novamusic.ozel"\n        minSdk 24\n        targetSdk 34\n        versionCode 2\n        versionName "1.1"\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n}\n' > app/build.gradle

          echo "" | base64 -d > app/src/main/AndroidManifest.xml

          printf 'package com.novamusic.ozel\n\nimport android.annotation.SuppressLint\nimport android.app.Activity\nimport android.os.Bundle\nimport android.webkit.WebChromeClient\nimport android.webkit.WebSettings\nimport android.webkit.WebView\nimport android.webkit.WebViewClient\n\nclass MainActivity : Activity() {\n    private lateinit var webView: WebView\n\n    @SuppressLint("SetJavaScriptEnabled")\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        webView = WebView(this)\n        setContentView(webView)\n\n        webView.settings.apply {\n            javaScriptEnabled = true\n            domStorageEnabled = true\n            allowFileAccess = true\n            allowContentAccess = true\n            mediaPlaybackRequiresUserGesture = false\n            cacheMode = WebSettings.LOAD_NO_CACHE\n            mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW\n        }\n\n        webView.webViewClient = WebViewClient()\n        webView.webChromeClient = WebChromeClient()\n        webView.loadUrl("file:///android_asset/index.html")\n    }\n\n    @Deprecated("Deprecated in Java")\n    override fun onBackPressed() {\n        if (webView.canGoBack()) {\n            webView.goBack()\n        } else {\n            super.onBackPressed()\n        }\n    }\n}\n' > app/src/main/java/com/novamusic/ozel/MainActivity.kt

      - name: APK Derle
        run: gradle assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MUSIC-OZEL-APK
          path: app/build/outputs/apk/debug/*.apk
